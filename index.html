<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registro de Atendimento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  max-width: 820px;
  margin: 20px auto;
  background: #f4f4f4;
  padding: 20px;
  border-radius: 8px;
}
label { font-weight: bold; margin-top: 12px; display:block; }
input, textarea, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}
button {
  background: #28a745;
  color: #fff;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}
button:hover { background: #218838; }
#atendimentoForm, #finalizarBox { display:none; }
#statusAtendimento { font-weight: bold; }
#localServicoStatus { margin: 6px 0; font-weight: bold; }
</style>
</head>

<body>

<h2>Registro de Atendimento</h2>

<!-- LOGIN -->
<div id="loginForm">
  <label>Email</label>
  <input id="loginEmail">
  <label>Senha</label>
  <input id="loginSenha" type="password">
  <button onclick="login()">Entrar</button>
</div>

<!-- ATENDIMENTO -->
<div id="atendimentoForm">
  <p>
    Técnico: <strong id="tecnicoLogado"></strong><br>
    <span id="statusAtendimento">🟢 LIVRE</span>
  </p>

  <p id="localServicoStatus">📍 Local do serviço: não informado</p>

  <label>Auxiliar</label>
  <select id="auxiliar"></select>

  <label>Veículo</label>
  <select id="veiculo"></select>

  <label>Protocolo</label>
  <input id="protocolo" type="number">

  <label>Causa do Serviço</label>
  <textarea id="motivo"></textarea>

  <label>KM Inicial</label>
  <input id="kmInicial" type="number">

  <button onclick="iniciarAtendimento()">📍 Iniciar Atendimento</button>

  <div id="finalizarBox">
    <label>KM Final</label>
    <input id="kmFinal" type="number">

    <label>Como resolveu</label>
    <textarea id="comoResolveu"></textarea>

    <button onclick="finalizarAtendimento()">✅ Finalizar Atendimento</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================= SUPABASE ================= */
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

/* ================= VARIÁVEIS ================= */
let tecnicoNome = "";
let atendimentoAtual = null;

/* ================= DATA ================= */
function agoraBR() {
  return new Date().toISOString().slice(0,19);
}

/* ================= LOCAL DO SERVIÇO (GPS) ================= */
function obterLocalServico() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      alert("GPS não suportado");
      return reject();
    }

    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = {
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          precisao: pos.coords.accuracy
        };

        localServicoStatus.textContent =
          `📍 ${loc.latitude.toFixed(6)}, ${loc.longitude.toFixed(6)} (±${Math.round(loc.precisao)}m)`;

        resolve(loc);
      },
      () => {
        alert("Permita a localização para registrar o local do serviço");
        reject();
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  });
}

/* ================= LOGIN ================= */
async function login() {
  const { data } = await supabaseClient
    .from("tecnicos")
    .select("nome")
    .eq("email", loginEmail.value)
    .eq("senha", loginSenha.value)
    .eq("ativo", true)
    .single();

  if (!data) return alert("Login inválido");

  tecnicoNome = data.nome;
  tecnicoLogado.textContent = tecnicoNome;
  loginForm.style.display = "none";
  atendimentoForm.style.display = "block";

  carregarAuxiliares();
  carregarVeiculos();
}

/* ================= LISTAS ================= */
async function carregarAuxiliares() {
  const { data } = await supabaseClient.from("auxiliares").select("nome");
  auxiliar.innerHTML="";
  (data||[]).forEach(a=>{
    const o=document.createElement("option");
    o.value=o.textContent=a.nome;
    auxiliar.appendChild(o);
  });
}

async function carregarVeiculos() {
  const { data } = await supabaseClient.from("veiculos").select("placa,modelo");
  veiculo.innerHTML="<option value=''>— Sem veículo —</option>";
  (data||[]).forEach(v=>{
    const o=document.createElement("option");
    o.value=v.placa;
    o.textContent=`${v.placa} - ${v.modelo}`;
    veiculo.appendChild(o);
  });
}

/* ================= INICIAR ATENDIMENTO ================= */
async function iniciarAtendimento() {
  let locServico;
  try {
    locServico = await obterLocalServico();
  } catch {
    return;
  }

  const at = {
    tecnico_nome: tecnicoNome,
    auxiliar_nome: auxiliar.value,
    veiculo_nome: veiculo.value || null,
    protocolo: protocolo.value,
    motivo: motivo.value,
    km_inicial: kmInicial.value,
    inicio_deslocamento: agoraBR(),
    status: "aberto",
    latitude_servico: locServico.latitude,
    longitude_servico: locServico.longitude
  };

  await supabaseClient.from("atendimentos").insert(at);

  atendimentoAtual = at;
  statusAtendimento.textContent = "🔴 EM ATENDIMENTO";
  finalizarBox.style.display = "block";

  // 📍 ABRE O LOCAL DO SERVIÇO NO MAPA
  window.open(
    `https://www.google.com/maps?q=${locServico.latitude},${locServico.longitude}`,
    "_blank"
  );
}

/* ================= FINALIZAR ================= */
async function finalizarAtendimento() {
  await supabaseClient
    .from("atendimentos")
    .update({
      fim_atendimento: agoraBR(),
      km_final: kmFinal.value || null,
      como_resolveu: comoResolveu.value || "Retorno à base",
      status: "finalizado"
    })
    .eq("tecnico_nome", tecnicoNome)
    .eq("status", "aberto");

  location.reload();
}
</script>

</body>
</html>
