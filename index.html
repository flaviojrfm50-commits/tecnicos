<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel do Técnico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  max-width: 820px;
  margin: 20px auto;
  background: #f4f4f4;
  padding: 20px;
  border-radius: 8px;
}
label { font-weight: bold; margin-top: 12px; display:block; }
input, textarea, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}
button {
  background: #28a745;
  color: #fff;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}
button:hover { background: #218838; }
#atendimentoForm, #statusAtendimento { display:none; }
#statusAtendimento {
  font-weight: bold;
  font-size: 16px;
  margin: 8px 0;
}
</style>
</head>

<body>

<h2>Painel do Técnico</h2>

<!-- LOGIN -->
<div id="loginForm">
  <label>Email</label>
  <input id="loginEmail">
  <label>Senha</label>
  <input id="loginSenha" type="password">
  <button onclick="login()">Entrar</button>
</div>

<!-- ATENDIMENTOS -->
<div id="atendimentoForm">
  <p>
    Técnico: <strong id="tecnicoLogado"></strong><br>
    <span id="statusAtendimento">🟢 SEM ATENDIMENTO</span>
  </p>

  <label>Atendimentos Disponíveis</label>
  <select id="selectAtendimento"></select>

  <div id="iniciarBox" style="display:none;">
    <label>KM Inicial</label>
    <input id="kmInicial" type="number">
    <button onclick="iniciarAtendimento()">▶ Iniciar Atendimento</button>
  </div>

  <div id="finalizarBox" style="display:none;">
    <label>KM Final</label>
    <input id="kmFinal" type="number">

    <label>Como resolveu</label>
    <textarea id="comoResolveu"></textarea>

    <button onclick="finalizarAtendimento()">✅ Finalizar Atendimento</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

const TELEGRAM_TOKEN = "8401740337:AAFxWCHx8M8Mc8Z-WHhhT-nfGlhAGP9L4dA";
const TELEGRAM_CHAT_ID = "-4860857271";

let tecnicoNome = "";
let atendimentoAtual = null;

/* ================= HORA LOCAL ================= */
function agoraBR() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}T${hh}:${mi}:${ss}`;
}

function dataBR(iso) { const [d] = iso.split("T"); const [y,m,da] = d.split("-"); return `${da}/${m}/${y}`; }
function horaBR(iso) { return iso.split("T")[1].slice(0,5); }
function formatarMinutos(min) { const h = Math.floor(min/60); const m = min%60; return `${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}`; }

function setEmAtendimento() { statusAtendimento.textContent="🔴 EM ATENDIMENTO"; }
function setSemAtendimento() { 
  statusAtendimento.textContent="🟢 SEM ATENDIMENTO"; 
  kmFinal.value=""; 
  kmInicial.value=""; 
  comoResolveu.value=""; 
  finalizarBox.style.display="none"; 
  iniciarBox.style.display="none"; 
  atendimentoAtual=null; 
}

/* ================= PLANTÃO ================= */
function calcularMinutosPlantao(inicioISO, fimISO) {
  let atual = new Date(inicioISO);
  const fim = new Date(fimISO);
  let minutos = 0;
  while (atual < fim) {
    const h = atual.getHours();
    if (h >= 18 || h < 8) minutos++;
    atual.setMinutes(atual.getMinutes() + 1);
  }
  return minutos;
}

/* ================= LOGIN ================= */
async function login() {
  const { data } = await supabaseClient
    .from("tecnicos")
    .select("nome")
    .eq("email", loginEmail.value)
    .eq("senha", loginSenha.value)
    .eq("ativo", true)
    .single();
  
  if(!data) return alert("Login inválido");

  tecnicoNome = data.nome;
  tecnicoLogado.textContent = tecnicoNome;
  loginForm.style.display="none";
  atendimentoForm.style.display="block";

  carregarAtendimentos();
}

/* ================= CARREGAR ATENDIMENTOS ABERTOS ================= */
async function carregarAtendimentos() {
  const { data } = await supabaseClient
    .from("atendimentos")
    .select("*")
    .eq("tecnico_nome", tecnicoNome)
    .eq("status", "aberto")
    .order("inicio_deslocamento");

  selectAtendimento.innerHTML="";
  if(!data || data.length===0) {
    setSemAtendimento();
    selectAtendimento.innerHTML="<option>Nenhum atendimento disponível</option>";
    return;
  }

  data.forEach(a=>{
    const o = document.createElement("option");
    o.value = a.id;
    o.textContent = `Prot: ${a.protocolo} | Serviço: ${a.motivo}`;
    selectAtendimento.appendChild(o);
  });

  // Seleciona o primeiro atendimento
  selectAtendimento.value = data[0].id;
  atendimentoAtual = data[0];

  if(!atendimentoAtual.km_inicial) {
    iniciarBox.style.display="block";
    finalizarBox.style.display="none";
    setEmAtendimento();
  } else {
    kmInicial.value = atendimentoAtual.km_inicial;
    iniciarBox.style.display="none";
    finalizarBox.style.display="block";
    setEmAtendimento();
  }
}

/* ================= INICIAR ATENDIMENTO ================= */
async function iniciarAtendimento() {
  if(!atendimentoAtual) return alert("Selecione um atendimento");
  if(!kmInicial.value) return alert("Informe o KM Inicial");

  const dados = {
    km_inicial: Number(kmInicial.value),
    inicio_deslocamento: agoraBR()
  };

  const { error, data } = await supabaseClient
    .from("atendimentos")
    .update(dados)
    .eq("id", atendimentoAtual.id);

  if(error) return alert("Erro ao iniciar atendimento: "+error.message);

  atendimentoAtual = { ...atendimentoAtual, ...dados };
  await enviarTelegramInicio(atendimentoAtual);

  iniciarBox.style.display="none";
  finalizarBox.style.display="block";
  setEmAtendimento();
}

/* ================= TELEGRAM ================= */
async function enviarTelegramInicio(at) {
  await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      chat_id: TELEGRAM_CHAT_ID,
      text:
`🚨 ATENDIMENTO INICIADO
📅 ${dataBR(at.inicio_deslocamento)}
👷 Técnico: ${at.tecnico_nome}
📄 Protocolo: ${at.protocolo}
🛠 Tipo de Serviço: ${at.motivo}
🚗 Localização: ${at.latitude_servico && at.longitude_servico ? "https://www.google.com/maps?q="+at.latitude_servico+","+at.longitude_servico : "Não informado"}
⏳ Em andamento...`
    })
  });
}

/* ================= FINALIZAR ================= */
async function finalizarAtendimento() {
  if(!atendimentoAtual) return alert("Nenhum atendimento selecionado");

  const fim = agoraBR();
  const minutosPlantao = calcularMinutosPlantao(atendimentoAtual.inicio_deslocamento, fim);
  const kmTotal = kmFinal.value ? Number(kmFinal.value) - Number(atendimentoAtual.km_inicial) : null;

  const dados = {
    fim_atendimento: fim,
    status: "finalizado",
    km_final: kmFinal.value || null,
    km_total: kmTotal,
    minutos_plantao: minutosPlantao,
    como_resolveu: comoResolveu.value || "Retorno à base"
  };

  const { error } = await supabaseClient.from("atendimentos").update(dados).eq("id", atendimentoAtual.id);
  if(error) return alert("Erro ao finalizar atendimento: "+error.message);

  await editarTelegramFinal({ ...atendimentoAtual, ...dados }, minutosPlantao);

  alert("Atendimento finalizado!");
  carregarAtendimentos();
}

async function editarTelegramFinal(at, minutosPlantao) {
  await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      chat_id: TELEGRAM_CHAT_ID,
      text:
`✅ ATENDIMENTO FINALIZADO
📅 ${dataBR(at.inicio_deslocamento)}
👷 Técnico: ${at.tecnico_nome}
📄 Protocolo: ${at.protocolo}
🛠 Tipo de Serviço: ${at.motivo}
🚗 Localização: ${at.latitude_servico && at.longitude_servico ? "https://www.google.com/maps?q="+at.latitude_servico+","+at.longitude_servico : "Não informado"}
🕒 Início: ${horaBR(at.inicio_deslocamento)}
🕒 Fim: ${horaBR(at.fim_atendimento)}
🚗 KM Inicial: ${at.km_inicial || "-"}
🚗 KM Final: ${at.km_final || "-"}
📏 KM Total: ${at.km_total !== null ? at.km_total : "-"}
⏱ Plantão: ${formatarMinutos(minutosPlantao)}
🧰 Como resolveu: ${at.como_resolveu}`
    })
  });
}

</script>
</body>
</html>
