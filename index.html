<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel do Técnico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; max-width: 820px; margin: 20px auto; background: #f4f4f4; padding: 20px; border-radius: 8px; }
label { font-weight: bold; margin-top: 12px; display:block; }
input, textarea, select, button { width: 100%; padding: 10px; margin-top: 5px; }
button { background: #28a745; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
button:hover { background: #218838; }
#atendimentoForm, #statusAtendimento { display:none; }
#statusAtendimento { font-weight: bold; font-size: 16px; margin: 8px 0; }
</style>
</head>

<body>

<h2>Painel do Técnico</h2>

<!-- LOGIN -->
<div id="loginForm">
  <label>Email</label>
  <input id="loginEmail">
  <label>Senha</label>
  <input id="loginSenha" type="password">
  <button onclick="login()">Entrar</button>
</div>

<!-- ATENDIMENTOS -->
<div id="atendimentoForm">
  <p>
    Técnico: <strong id="tecnicoLogado"></strong><br>
    <span id="statusAtendimento">🟢 SEM ATENDIMENTO</span>
  </p>

  <label>Atendimentos Disponíveis</label>
  <select id="selectAtendimento"></select>

  <!-- INICIAR ATENDIMENTO -->
  <div id="iniciarBox" style="display:none;">
    <label>KM Inicial</label>
    <input id="kmInicial" type="number" placeholder="Informe o KM inicial">
    <button onclick="iniciarAtendimento()">▶️ Iniciar Atendimento</button>
  </div>

  <!-- FINALIZAR ATENDIMENTO -->
  <div id="finalizarBox" style="display:none;">
    <label>KM Final</label>
    <input id="kmFinal" type="number" placeholder="Informe o KM final">

    <label>Como resolveu</label>
    <textarea id="comoResolveu" placeholder="Descreva como resolveu"></textarea>

    <button onclick="finalizarAtendimento()">✅ Finalizar Atendimento</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

// Substitua pelo seu token real
const TELEGRAM_TOKEN = "8401740337:AAFxWCHx8M8Mc8Z-WHhhT-nfGlhAGP9L4dA";
const TELEGRAM_CHAT_ID = "-4860857271";

let tecnicoNome = "";
let atendimentoAtual = null;

/* ===== FUNÇÕES DE TEMPO ===== */
function agoraBR() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}T${hh}:${mi}:${ss}`;
}

function dataBR(iso) {
  const [date] = iso.split("T");
  const [y,m,d] = date.split("-");
  return `${d}/${m}/${y}`;
}

function horaBR(iso) {
  return iso.split("T")[1].slice(0,5);
}

function formatarMinutos(min) {
  const horas = Math.floor(min / 60);
  const mins = min % 60;
  return `${String(horas).padStart(2,"0")}h${String(mins).padStart(2,"0")}min`;
}

function setEmAtendimento() {
  document.getElementById("statusAtendimento").textContent = "🔴 EM ATENDIMENTO";
}

function setSemAtendimento() {
  document.getElementById("statusAtendimento").textContent = "🟢 SEM ATENDIMENTO";
  document.getElementById("iniciarBox").style.display = "none";
  document.getElementById("finalizarBox").style.display = "none";
}

/* ===== CÁLCULO DO PLANTÃO ===== */
function calcularMinutosPlantao(inicioISO, fimISO) {
  let atual = new Date(inicioISO);
  const fim = new Date(fimISO);
  let minutos = 0;
  while (atual < fim) {
    const h = atual.getHours();
    if (h >= 18 || h < 8) minutos++;
    atual.setMinutes(atual.getMinutes()+1);
  }
  return minutos;
}

/* ===== LOGIN ===== */
async function login() {
  const { data } = await supabaseClient
    .from("tecnicos")
    .select("nome")
    .eq("email", loginEmail.value)
    .eq("senha", loginSenha.value)
    .eq("ativo", true)
    .single();

  if (!data) return alert("Login inválido");
  tecnicoNome = data.nome;
  document.getElementById("tecnicoLogado").textContent = tecnicoNome;
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("atendimentoForm").style.display = "block";
  carregarAtendimentos();
}

/* ===== LISTAR ATENDIMENTOS ABERTOS ===== */
async function carregarAtendimentos() {
  const { data } = await supabaseClient
    .from("atendimentos")
    .select("*")
    .eq("tecnico_nome", tecnicoNome)
    .eq("status", "aberto")
    .order("inicio_deslocamento");

  const select = document.getElementById("selectAtendimento");
  select.innerHTML = "";
  if(!data || data.length === 0) {
    setSemAtendimento();
    select.innerHTML = "<option>Nenhum atendimento disponível</option>";
    return;
  }

  data.forEach(a => {
    const o = document.createElement("option");
    o.value = a.id;
    o.textContent = `Prot: ${a.protocolo} | Serviço: ${a.tipo_servico || a.motivo || "Não informado"}`;
    select.appendChild(o);
  });

  atendimentoAtual = data[0];
  select.value = atendimentoAtual.id;

  if (!atendimentoAtual.km_inicial) {
    document.getElementById("iniciarBox").style.display = "block";
    document.getElementById("finalizarBox").style.display = "none";
    setSemAtendimento();
  } else {
    document.getElementById("iniciarBox").style.display = "none";
    document.getElementById("finalizarBox").style.display = "block";
    setEmAtendimento();
  }
}

/* ===== INICIAR ATENDIMENTO ===== */
async function iniciarAtendimento() {
  if (!atendimentoAtual) return alert("Selecione um atendimento");
  const kmIni = document.getElementById("kmInicial").value;
  if (!kmIni) return alert("Informe o KM inicial");

  const dados = {
    km_inicial: Number(kmIni),
    inicio_deslocamento: agoraBR(),
    status: "em andamento"
  };

  const { data, error } = await supabaseClient
    .from("atendimentos")
    .update(dados)
    .eq("id", atendimentoAtual.id)
    .select()
    .single();

  if (error) return alert("Erro ao iniciar: "+error.message);

  atendimentoAtual = data;
  setEmAtendimento();
  document.getElementById("iniciarBox").style.display="none";
  document.getElementById("finalizarBox").style.display="block";

  await enviarTelegramInicio(atendimentoAtual);
}

/* ===== ENVIAR MENSAGEM INICIAL PARA TELEGRAM ===== */
async function enviarTelegramInicio(at) {
  const resp = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: TELEGRAM_CHAT_ID,
      text:
`🚨 ATENDIMENTO INICIADO
📅 ${dataBR(at.inicio_deslocamento)}
👷 Técnico: ${at.tecnico_nome}
📄 Protocolo: ${at.protocolo}
🛠 Tipo de Serviço: ${at.tipo_servico || at.motivo || "Não informado"}
🚗 Carro: ${at.veiculo || at.placa || "Não informado"}
🚗 Localização: ${at.localizacao || "Não informado"}
⏳ Em andamento...`
    })
  });
  const json = await resp.json();
  atendimentoAtual.telegram_message_id = json.result.message_id;
}

/* ===== FINALIZAR ATENDIMENTO ===== */
async function finalizarAtendimento() {
  if (!atendimentoAtual) return alert("Nenhum atendimento selecionado");

  const kmF = document.getElementById("kmFinal").value;
  const relato = document.getElementById("comoResolveu").value;

  if (!kmF) return alert("Informe o KM final");
  if (!relato) return alert("Descreva como resolveu");

  const fim = agoraBR();
  const minutosPlantao = calcularMinutosPlantao(atendimentoAtual.inicio_deslocamento, fim);
  const kmTotal = Number(kmF) - Number(atendimentoAtual.km_inicial);

  const dados = {
    fim_atendimento: fim,
    status: "finalizado",
    km_final: Number(kmF),
    km_total: kmTotal,
    minutos_plantao: minutosPlantao,
    como_resolveu: relato
  };

  await supabaseClient.from("atendimentos").update(dados).eq("id", atendimentoAtual.id);

  // Edita mensagem no Telegram
  await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/editMessageText`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: TELEGRAM_CHAT_ID,
      message_id: atendimentoAtual.telegram_message_id,
      text:
`✅ ATENDIMENTO FINALIZADO
📅 ${dataBR(atendimentoAtual.inicio_deslocamento)}
👷 Técnico: ${atendimentoAtual.tecnico_nome}
📄 Protocolo: ${atendimentoAtual.protocolo}
🛠 Tipo de Serviço: ${atendimentoAtual.tipo_servico || atendimentoAtual.motivo || "Não informado"}
🚗 Carro: ${atendimentoAtual.veiculo || atendimentoAtual.placa || "Não informado"}
🚗 Localização: ${atendimentoAtual.localizacao || "Não informado"}
🕒 Início: ${horaBR(atendimentoAtual.inicio_deslocamento)}
🕒 Fim: ${horaBR(dados.fim_atendimento)}
🚗 KM Inicial: ${atendimentoAtual.km_inicial}
🚗 KM Final: ${dados.km_final}
📏 KM Total: ${dados.km_total}
⏱ Plantão: ${formatarMinutos(minutosPlantao)}
🧰 Como resolveu: ${dados.como_resolveu}`
    })
  });

  alert("Atendimento finalizado!");
  carregarAtendimentos();
}
</script>

</body>
</html>
