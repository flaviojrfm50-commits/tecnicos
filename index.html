<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registro de Atendimento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  max-width: 820px;
  margin: 20px auto;
  background: #f4f4f4;
  padding: 20px;
  border-radius: 8px;
}
label { font-weight: bold; margin-top: 12px; display:block; }
input, textarea, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}
button {
  background: #28a745;
  color: #fff;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}
button:hover { background: #218838; }
#atendimentoForm, #finalizarBox { display:none; }
#statusAtendimento {
  font-weight: bold;
  font-size: 16px;
  margin: 8px 0;
}
</style>
</head>

<body>

<h2>Registro de Atendimento</h2>

<!-- LOGIN -->
<div id="loginForm">
  <label>Email</label>
  <input id="loginEmail">
  <label>Senha</label>
  <input id="loginSenha" type="password">
  <button onclick="login()">Entrar</button>
</div>

<!-- ATENDIMENTO -->
<div id="atendimentoForm">
  <p>
    Técnico: <strong id="tecnicoLogado"></strong><br>
    <span id="statusAtendimento">🟢 LIVRE</span>
  </p>

  <label>Auxiliar</label>
  <select id="auxiliar"></select>

  <label>Veículo</label>
  <select id="veiculo"></select>

  <label>Protocolo</label>
  <input id="protocolo" type="number">

  <label>Causa do Serviço</label>
  <textarea id="motivo"></textarea>

  <label>KM Inicial</label>
  <input id="kmInicial" type="number">

  <button id="btnIniciar" onclick="iniciarAtendimento()">🚀 Iniciar Atendimento</button>

  <div id="finalizarBox">
    <label>KM Final</label>
    <input id="kmFinal" type="number">

    <label>Como resolveu</label>
    <textarea id="comoResolveu"></textarea>

    <button onclick="finalizarAtendimento()">✅ Finalizar Atendimento</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================= SUPABASE ================= */
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

/* ================= TELEGRAM ================= */
const TELEGRAM_TOKEN = "SEU_TOKEN";
const TELEGRAM_CHAT_ID = "SEU_CHAT_ID";

/* ================= VARIÁVEIS ================= */
let tecnicoNome = "";
let atendimentoAtual = null;

/* ================= INTERNET ================= */
function online() {
  return navigator.onLine;
}
window.addEventListener("online", sincronizarPendentes);

/* ================= DATA ================= */
function agoraBR() {
  const d = new Date();
  return d.toISOString().slice(0,19);
}

/* ================= GPS ================= */
function obterLocalizacao() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude
      }),
      () => reject(),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

/* ================= OFFLINE ================= */
function salvarOffline(at) {
  const fila = JSON.parse(localStorage.getItem("filaAtendimentos") || "[]");
  fila.push(at);
  localStorage.setItem("filaAtendimentos", JSON.stringify(fila));
}

/* ================= LOGIN ================= */
async function login() {
  const { data } = await supabaseClient
    .from("tecnicos")
    .select("nome")
    .eq("email", loginEmail.value)
    .eq("senha", loginSenha.value)
    .eq("ativo", true)
    .single();

  if (!data) return alert("Login inválido");

  tecnicoNome = data.nome;
  tecnicoLogado.textContent = tecnicoNome;
  loginForm.style.display = "none";
  atendimentoForm.style.display = "block";

  carregarAuxiliares();
  carregarVeiculos();
}

/* ================= LISTAS ================= */
async function carregarAuxiliares() {
  const { data } = await supabaseClient.from("auxiliares").select("nome");
  auxiliar.innerHTML="";
  (data||[]).forEach(a=>{
    const o=document.createElement("option");
    o.value=o.textContent=a.nome;
    auxiliar.appendChild(o);
  });
}
async function carregarVeiculos() {
  const { data } = await supabaseClient.from("veiculos").select("placa,modelo");
  veiculo.innerHTML="<option value=''>— Sem veículo —</option>";
  (data||[]).forEach(v=>{
    const o=document.createElement("option");
    o.value=v.placa;
    o.textContent=`${v.placa} - ${v.modelo}`;
    veiculo.appendChild(o);
  });
}

/* ================= INICIAR ================= */
async function iniciarAtendimento() {
  let loc;
  try { loc = await obterLocalizacao(); }
  catch { return alert("Ative o GPS"); }

  const at = {
    tecnico_nome: tecnicoNome,
    auxiliar_nome: auxiliar.value,
    veiculo_nome: veiculo.value || null,
    protocolo: protocolo.value,
    motivo: motivo.value,
    km_inicial: kmInicial.value,
    inicio_deslocamento: agoraBR(),
    status: "aberto",
    latitude_inicio: loc.latitude,
    longitude_inicio: loc.longitude
  };

  if (!online()) {
    at.offline = true;
    salvarOffline(at);
    abrirMapa(loc);
    atendimentoAtual = at;
    finalizarBox.style.display="block";
    return alert("Sem internet. Salvo offline.");
  }

  await supabaseClient.from("atendimentos").insert(at);
  abrirMapa(loc);
  atendimentoAtual = at;
  finalizarBox.style.display="block";
}

/* ================= FINALIZAR ================= */
async function finalizarAtendimento() {
  atendimentoAtual.fim_atendimento = agoraBR();
  atendimentoAtual.km_final = kmFinal.value || null;
  atendimentoAtual.como_resolveu = comoResolveu.value || "Retorno à base";
  atendimentoAtual.status = "finalizado";

  if (atendimentoAtual.offline) {
    salvarOffline(atendimentoAtual);
    return location.reload();
  }

  await supabaseClient
    .from("atendimentos")
    .update(atendimentoAtual)
    .eq("tecnico_nome", tecnicoNome)
    .eq("status","aberto");

  location.reload();
}

/* ================= MAPA ================= */
function abrirMapa(loc) {
  window.open(`https://www.google.com/maps?q=${loc.latitude},${loc.longitude}`, "_blank");
}

/* ================= SINCRONIZAR ================= */
async function sincronizarPendentes() {
  const fila = JSON.parse(localStorage.getItem("filaAtendimentos") || "[]");
  if (!fila.length) return;

  for (const at of fila) {
    await supabaseClient.from("atendimentos").insert(at);
  }
  localStorage.removeItem("filaAtendimentos");
  alert("Atendimentos offline sincronizados!");
}
</script>

</body>
</html>
