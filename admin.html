<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel Técnico - Atendimento</title>
<style>
  body { font-family: Arial; max-width: 600px; margin: 20px auto; background:#f9f9f9; padding: 20px; border-radius: 8px; }
  h2 { text-align:center; }
  label { display:block; margin-top:15px; font-weight:bold; }
  input, textarea, select, button { width: 100%; padding:8px; margin-top:5px; }
  button { background:#28a745; border:none; color:#fff; font-weight:bold; cursor:pointer; border-radius:4px; margin-top:15px; }
  button[disabled] { background:#ccc; cursor:not-allowed; }
  .link-maps { margin-top:5px; font-size: 0.9em; }
  .status { margin-top:10px; font-weight:bold; color: #dc3545; }
  .hidden { display:none; }
</style>
</head>
<body>

<h2>Painel Técnico - Atendimento</h2>

<!-- Exemplo: preencha aqui os dados do técnico -->
<label>Técnico</label>
<input type="text" id="nomeTecnico" placeholder="Nome do Técnico" />

<label>Protocolo (preenchido automaticamente ou por sistema)</label>
<input type="text" id="protocolo" placeholder="Protocolo" />

<label>Tipo de Serviço <small>(obrigatório)</small></label>
<select id="tipoServico">
  <option value="">-- Selecione o tipo de serviço --</option>
  <option value="Ampliação FTTH">Ampliação FTTH</option>
  <option value="Manutenção">Manutenção</option>
  <option value="Instalação">Instalação</option>
  <option value="Reparo">Reparo</option>
  <!-- outros tipos -->
</select>

<label>Localização (latitude, longitude)</label>
<input type="text" id="latitude" placeholder="Latitude" />
<input type="text" id="longitude" placeholder="Longitude" />
<div class="link-maps" id="mapLink"></div>

<button id="btnIniciar">Iniciar Atendimento</button>

<div id="finalizarSection" class="hidden">
  <h3>Finalizar Atendimento</h3>
  <label>KM final <small>(obrigatório)</small></label>
  <input type="number" id="kmFinal" min="0" placeholder="KM final" />
  
  <label>Relato de resolução <small>(obrigatório)</small></label>
  <textarea id="relatoResolucao" rows="4" placeholder="Descreva como resolveu o atendimento"></textarea>
  
  <button id="btnFinalizar">Finalizar Atendimento</button>
</div>

<div class="status" id="statusMsg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://bzgvbghxmebdjqnlakbj.supabase.co";
  const supabaseKey = "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv";
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  let atendimentoId = null;

  const nomeTecnico = document.getElementById("nomeTecnico");
  const protocolo = document.getElementById("protocolo");
  const tipoServico = document.getElementById("tipoServico");
  const latitude = document.getElementById("latitude");
  const longitude = document.getElementById("longitude");
  const mapLink = document.getElementById("mapLink");
  const btnIniciar = document.getElementById("btnIniciar");

  const finalizarSection = document.getElementById("finalizarSection");
  const kmFinal = document.getElementById("kmFinal");
  const relatoResolucao = document.getElementById("relatoResolucao");
  const btnFinalizar = document.getElementById("btnFinalizar");
  const statusMsg = document.getElementById("statusMsg");

  // Atualiza o link do Google Maps conforme latitude e longitude digitados
  function atualizarLinkMapa() {
    const lat = latitude.value.trim();
    const lon = longitude.value.trim();
    if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
      mapLink.innerHTML = `<a href="https://www.google.com/maps/place/${lat}+${lon}" target="_blank" rel="noopener">Ver Localização no Google Maps</a>`;
    } else {
      mapLink.innerHTML = "";
    }
  }
  latitude.addEventListener("input", atualizarLinkMapa);
  longitude.addEventListener("input", atualizarLinkMapa);

  btnIniciar.addEventListener("click", async () => {
    statusMsg.textContent = "";
    // Valida campos obrigatórios
    if (!nomeTecnico.value.trim()) {
      alert("Informe o nome do técnico.");
      return;
    }
    if (!protocolo.value.trim()) {
      alert("Informe o protocolo.");
      return;
    }
    if (!tipoServico.value) {
      alert("Selecione o tipo de serviço.");
      return;
    }
    if (!latitude.value.trim() || isNaN(latitude.value.trim())) {
      alert("Informe uma latitude válida.");
      return;
    }
    if (!longitude.value.trim() || isNaN(longitude.value.trim())) {
      alert("Informe uma longitude válida.");
      return;
    }

    // Monta objeto de inserção com todos os campos obrigatórios (incluindo motivo)
    const dadosAtendimento = {
      tecnico_nome: nomeTecnico.value.trim(),
      protocolo: protocolo.value.trim(),
      tipo_servico: tipoServico.value,
      latitude_inicio: parseFloat(latitude.value.trim()),
      longitude_inicio: parseFloat(longitude.value.trim()),
      inicio_deslocamento: new Date().toISOString(),
      status: "aberto",
      motivo: `Serviço iniciado: ${tipoServico.value}`, // Exemplo de motivo inicial, pode ajustar
      minutos_plantao: 0
    };

    // Insere no banco
    const { data, error } = await supabase
      .from("atendimentos")
      .insert([dadosAtendimento]);

    if (error) {
      statusMsg.textContent = "Erro ao criar atendimento: " + error.message;
      statusMsg.style.color = "#dc3545";
      return;
    }

    atendimentoId = data[0].id;
    statusMsg.textContent = "Atendimento iniciado com sucesso!";
    statusMsg.style.color = "#28a745";

    // Exibe seção para finalizar atendimento
    finalizarSection.classList.remove("hidden");

    // Desabilita os campos de início para evitar editar depois de iniciado
    nomeTecnico.disabled = true;
    protocolo.disabled = true;
    tipoServico.disabled = true;
    latitude.disabled = true;
    longitude.disabled = true;
    btnIniciar.disabled = true;
  });

  btnFinalizar.addEventListener("click", async () => {
    statusMsg.textContent = "";

    if (!atendimentoId) {
      alert("Nenhum atendimento iniciado.");
      return;
    }
    if (!kmFinal.value.trim() || isNaN(kmFinal.value.trim()) || Number(kmFinal.value.trim()) < 0) {
      alert("Informe o KM final válido.");
      return;
    }
    if (!relatoResolucao.value.trim()) {
      alert("Informe o relato de resolução.");
      return;
    }

    // Atualiza o atendimento com dados de encerramento
    const dadosFinalizacao = {
      km_final: Number(kmFinal.value.trim()),
      relato_resolucao: relatoResolucao.value.trim(),
      fim_atendimento: new Date().toISOString(),
      status: "finalizado"
    };

    const { error } = await supabase
      .from("atendimentos")
      .update(dadosFinalizacao)
      .eq("id", atendimentoId);

    if (error) {
      statusMsg.textContent = "Erro ao finalizar atendimento: " + error.message;
      statusMsg.style.color = "#dc3545";
      return;
    }

    statusMsg.textContent = "Atendimento finalizado com sucesso!";
    statusMsg.style.color = "#28a745";

    // Resetar formulário para novo atendimento
    atendimentoId = null;
    nomeTecnico.disabled = false;
    protocolo.disabled = false;
    tipoServico.disabled = false;
    latitude.disabled = false;
    longitude.disabled = false;
    btnIniciar.disabled = false;

    finalizarSection.classList.add("hidden");
    kmFinal.value = "";
    relatoResolucao.value = "";
  });
</script>

</body>
</html>
