<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Administração</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; max-width: 1000px; margin: 0 auto; background:#f4f4f4; padding:20px; border-radius:8px;}
h2,h3{text-align:center;}
label{font-weight:bold;margin-top:10px;display:block;}
input,textarea,select,button{width:100%;padding:8px;margin-top:5px;}
button{border:none;cursor:pointer;margin-top:8px;}
.btn-add{background:#007bff;color:#fff;}
.btn-edit{background:#ffc107;}
.btn-danger{background:#dc3545;color:#fff;}
.btn-success{background:#28a745;color:#fff;}
.btn-export{background:#28a745;color:#fff;margin-top:20px;}
table{width:100%;margin-top:15px;border-collapse:collapse;background:#fff;}
th,td{border:1px solid #ccc;padding:6px;}
th{background:#eee;}

/* ===== Login Modal ===== */
#loginModal {
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.6);
  display:flex; justify-content:center; align-items:center;
}
#loginModalContent {
  background:#fff; padding:30px; border-radius:8px; width:300px; text-align:center;
}
#loginModal input{width:100%; margin:8px 0; padding:8px;}
#btnSair {background:#dc3545;color:#fff; margin-bottom:20px;}
</style>
</head>
<body>

<!-- ===== Botão Sair ===== -->
<button id="btnSair" style="display:none;" onclick="logout()">Sair</button>

<h2>Administração</h2>

<!-- ================= TECNICOS ================= -->
<div id="adminContent">
<h3>Cadastro de Técnicos</h3>
<input type="hidden" id="editIdTec">
<label>Nome</label><input id="nomeTec">
<label>Email</label><input id="emailTec">
<label>Senha (opcional)</label><input id="senhaTec" type="password">
<button class="btn-add" onclick="salvarTecnico()">💾 Salvar Técnico</button>

<table>
<thead>
<tr><th>Nome</th><th>Email</th><th>Status</th><th>Ações</th></tr>
</thead>
<tbody id="listaTecnicos"></tbody>
</table>

<!-- ================= AUXILIARES ================= -->
<h3>Cadastro de Auxiliares</h3>
<input type="hidden" id="editIdAux">
<label>Nome</label><input id="nomeAux">
<label>Local / Base</label><input id="localAux">
<button class="btn-add" onclick="salvarAuxiliar()">💾 Salvar Auxiliar</button>

<table>
<thead>
<tr><th>Nome</th><th>Local</th><th>Status</th><th>Ações</th></tr>
</thead>
<tbody id="listaAuxiliares"></tbody>
</table>

<!-- ================= RELATORIO ================= -->
<h3>Relatório de Plantão</h3>
<label>Data início</label><input type="date" id="dataInicio">
<label>Data fim</label><input type="date" id="dataFim">
<button class="btn-export" onclick="exportarExcel()">📊 Exportar Excel</button>
</div>

<!-- ================= CRIAR ATENDIMENTO ================= -->
<div id="atendimentoContent" style="display:none;">
<h3>Criar Atendimento</h3>

<label>Protocolo (obrigatório)</label>
<input id="protocoloAtendimento" placeholder="Somente números">

<label>Protocolo SPE (opcional)</label>
<input id="protocoloSPEAtendimento" placeholder="Opcional">

<label>Tipo de Serviço</label>
<input id="tipoServico">

<label>Descrição</label>
<textarea id="descricaoAtendimento"></textarea>
<label>Material necessário (se houver)</label>
<textarea
  id="materiaisAtendimento"
  placeholder="Ex: ONT, fonte 12V, conector SC/APC, cabo drop...">
</textarea>

<label>Local do Serviço</label>
<input id="localServicoAtendimento" placeholder="Ex: SÃO JOÃO - ESCOLA MUNICIPAL">

<label>Localização (Google Maps)</label>
<input id="localizacaoAtendimento" placeholder="https://maps.app.goo.gl/...">

<label>Técnico Responsável</label>
<select id="tecnicoAtendimento"></select>

<button class="btn-add" onclick="criarAtendimento()">💾 Criar Atendimento</button>

<h3>Atendimentos Hoje</h3>
<table>
  <thead>
    <tr>
      <th>Protocolo</th>
      <th>Técnico</th>
      <th>Status</th>
      <th>Descrição</th>
    </tr>
  </thead>
  <tbody id="listaAtendimentosHoje"></tbody>
</table>
</div>

<!-- ===== Login Modal ===== -->
<div id="loginModal">
  <div id="loginModalContent">
    <h3>Login</h3>
    <input id="loginSenha" type="password" placeholder="Digite a senha">
    <button onclick="login()">Entrar</button>
    <p style="font-size:12px;margin-top:10px;">Senha Admin ou Atendimento</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

/* ===== SENHAS ===== */
const SENHA_ADMIN = "admin123";
const SENHA_ATENDIMENTO = "atendimento123";

/* ===== LOGIN ===== */
function login(){
  const senha = document.getElementById("loginSenha").value;
  if(senha === SENHA_ADMIN){
    localStorage.setItem("perfil","admin");
    mostrarConteudo();
  } else if(senha === SENHA_ATENDIMENTO){
    localStorage.setItem("perfil","atendimento");
    mostrarConteudo();
  } else {
    alert("Senha incorreta!");
  }
}

function logout(){
  localStorage.removeItem("perfil");
  document.getElementById("loginModal").style.display = "flex";
  document.getElementById("adminContent").style.display = "none";
  document.getElementById("atendimentoContent").style.display = "none";
  document.getElementById("btnSair").style.display = "none";
}

function mostrarConteudo(){
  const perfil = localStorage.getItem("perfil");
  if(perfil === "admin"){
    document.getElementById("adminContent").style.display = "block";
    document.getElementById("atendimentoContent").style.display = "none";
  } else if(perfil === "atendimento"){
    document.getElementById("adminContent").style.display = "none";
    document.getElementById("atendimentoContent").style.display = "block";
    listarAtendimentosHoje(); // mostra atendimentos quando entrar no painel
  }
  document.getElementById("loginModal").style.display = "none";
  document.getElementById("btnSair").style.display = "block";
}

/* ===== Persistência de Login ===== */
window.onload = function(){
  const perfil = localStorage.getItem("perfil");
  if(perfil){
    mostrarConteudo();
  } else {
    document.getElementById("loginModal").style.display = "flex";
  }

  listarTecnicos();
  listarAuxiliares();
  carregarTecnicosSelect();
};

/* ================= UTIL ================= */
function formatarPlantao(min){
  if(!min) return "00h00min";
  const h = Math.floor(min/60), m = min % 60;
  return `${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}min`;
}

/* ================= TECNICOS ================= */
async function listarTecnicos() {
  const { data: tecnicos } = await supabaseClient.from("tecnicos").select("*").order("nome");
  const { data: atendimentos } = await supabaseClient.from("atendimentos")
    .select("id, tecnico_nome, status")
    .in("status", ["aberto", "em_atendimento"]);

  listaTecnicos.innerHTML = "";

  (tecnicos || []).forEach(t => {
    const atendAtual = atendimentos.find(a => a.tecnico_nome === t.nome);
    let statusTexto = "";
    if (!t.ativo) statusTexto = "🔴 INATIVO";
    else if (!atendAtual) statusTexto = "🟢 SEM ATENDIMENTO";
    else statusTexto = atendAtual.status === "em_atendimento" ? "🔴 EM ATENDIMENTO" : "🟡 AGUARDANDO INÍCIO";

    listaTecnicos.innerHTML += `
      <tr>
        <td>${t.nome}</td>
        <td>${t.email}</td>
        <td>${statusTexto}</td>
        <td>
          <button class="btn-edit" onclick="editarTecnico('${t.id}','${t.nome}','${t.email}')">Editar</button>
          <button class="${t.ativo ? "btn-danger" : "btn-success"}" onclick="toggleTecnico('${t.id}',${t.ativo})">
            ${t.ativo ? "Desativar" : "Ativar"}
          </button>
        </td>
      </tr>`;
  });
}

async function salvarTecnico(){
  const dados = { nome: nomeTec.value, email: emailTec.value };
  if(senhaTec.value) dados.senha = senhaTec.value;

  if(editIdTec.value){
    await supabaseClient.from("tecnicos").update(dados).eq("id", editIdTec.value);
  } else {
    dados.ativo = true;
    await supabaseClient.from("tecnicos").insert(dados);
  }
  limparTec();
  listarTecnicos();
  carregarTecnicosSelect();
}

function editarTecnico(id,n,e){
  editIdTec.value = id;
  nomeTec.value = n;
  emailTec.value = e;
  senhaTec.value = "";
}

async function toggleTecnico(id,ativo){
  await supabaseClient.from("tecnicos").update({ativo: !ativo}).eq("id", id);
  listarTecnicos();
  carregarTecnicosSelect();
}

function limparTec(){
  editIdTec.value = "";
  nomeTec.value = "";
  emailTec.value = "";
  senhaTec.value = "";
}

/* ================= AUXILIARES ================= */
async function listarAuxiliares(){
  const {data} = await supabaseClient.from("auxiliares").select("*").order("nome");
  listaAuxiliares.innerHTML = "";
  (data || []).forEach(a=>{
    listaAuxiliares.innerHTML += `
    <tr>
      <td>${a.nome}</td>
      <td>${a.local || ""}</td>
      <td>${a.ativo ? "🟢 ATIVO" : "🔴 INATIVO"}</td>
      <td>
        <button class="btn-edit" onclick="editarAux('${a.id}','${a.nome}','${a.local || ""}')">Editar</button>
        <button class="${a.ativo ? "btn-danger" : "btn-success"}" onclick="toggleAux('${a.id}',${a.ativo})">
          ${a.ativo ? "Desativar" : "Ativar"}
        </button>
      </td>
    </tr>`;
  });
}

async function salvarAuxiliar(){
  const dados = { nome: nomeAux.value, local: localAux.value };
  if(editIdAux.value){
    await supabaseClient.from("auxiliares").update(dados).eq("id", editIdAux.value);
  } else {
    dados.ativo = true;
    await supabaseClient.from("auxiliares").insert(dados);
  }
  limparAux();
  listarAuxiliares();
}

function editarAux(id,n,l){
  editIdAux.value = id;
  nomeAux.value = n;
  localAux.value = l;
}

async function toggleAux(id,ativo){
  await supabaseClient.from("auxiliares").update({ativo: !ativo}).eq("id", id);
  listarAuxiliares();
}

function limparAux(){
  editIdAux.value = "";
  nomeAux.value = "";
  localAux.value = "";
}

/* ================= TECNICOS SELECT ================= */
async function carregarTecnicosSelect(){
  const {data} = await supabaseClient
    .from("tecnicos")
    .select("nome")
    .eq("ativo", true)
    .order("nome");

  tecnicoAtendimento.innerHTML = "<option value=''>Selecione o técnico</option>";
  (data || []).forEach(t=>{
    const o = document.createElement("option");
    o.value = t.nome;
    o.textContent = t.nome;
    tecnicoAtendimento.appendChild(o);
  });
}

/* ================= CRIAR ATENDIMENTO ================= */
async function criarAtendimento(){
  const protocolo = protocoloAtendimento.value;
  const tecnico = tecnicoAtendimento.value;

  if(!protocolo || !tecnico) return alert("Informe o protocolo e o técnico");

  const dados = {
    protocolo: Number(protocolo),
    protocolo_spe: protocoloSPEAtendimento.value || null,
    tipo_servico: tipoServico.value || null,
    descricao: descricaoAtendimento.value || null,
    materiais: materiaisAtendimento.value || null,
    local_servico: localServicoAtendimento.value || null,
    localizacao: localizacaoAtendimento.value || null,
    tecnico_nome: tecnico,
    status: "aberto",
    minutos_plantao: 0
  };

  const { error } = await supabaseClient.from("atendimentos").insert([dados]);
  if(error) return alert("Erro ao criar atendimento: " + error.message);

  alert("Atendimento criado com sucesso!");

  ["protocoloAtendimento","protocoloSPEAtendimento","tipoServico",
   "descricaoAtendimento","materiaisAtendimento","localServicoAtendimento",
   "localizacaoAtendimento","tecnicoAtendimento"].forEach(id=>document.getElementById(id).value="");

  listarAtendimentosHoje(); // Atualiza tabela
}

/* ================= LISTA ATENDIMENTOS HOJE ================= */
async function listarAtendimentosHoje() {
  const hoje = new Date().toISOString().split("T")[0];
  const { data } = await supabaseClient
    .from("atendimentos")
    .select("*")
    .gte("created_at", hoje + "T00:00:00")
    .lte("created_at", hoje + "T23:59:59")
    .order("created_at", { ascending: true });

  listaAtendimentosHoje.innerHTML = "";
  (data || []).forEach(a => {
    listaAtendimentosHoje.innerHTML += `
      <tr>
        <td>${a.protocolo}</td>
        <td>${a.tecnico_nome}</td>
        <td>${a.status}</td>
        <td>${a.descricao || ""}</td>
      </tr>`;
  });
}

/* ================= CALCULO DE PLANTAO ================= */
function minutosPlantao(inicioStr, fimStr) {
  if (!inicioStr || !fimStr) return 0;
  const inicio = new Date(inicioStr);
  const fim = new Date(fimStr);
  const inicioSP = new Date(inicio.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
  const fimSP = new Date(fim.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
  const plantaoStart = new Date(inicioSP);
  plantaoStart.setHours(18,0,0,0);
  if(fimSP <= plantaoStart) return 0;
  const realInicio = inicioSP < plantaoStart ? plantaoStart : inicioSP;
  return Math.floor((fimSP - realInicio)/60000);
}

/* ================= EXPORTAR EXCEL ================= */
async function exportarExcel() {
  if (!dataInicio.value || !dataFim.value) return alert("Informe o período");

  const inicioSP = new Date(dataInicio.value + "T00:00:00");
  const fimSP = new Date(dataFim.value + "T23:59:59");

  const { data, error } = await supabaseClient.from("atendimentos")
    .select("*").eq("status","finalizado");

  if(error) return alert("Erro ao buscar atendimentos: "+error.message);

  const filtrados = data.filter(a=>{
    const fimAtend = a.fim_atendimento ? new Date(a.fim_atendimento) : null;
    return fimAtend && fimAtend >= inicioSP && fimAtend <= fimSP;
  });

  if(!filtrados.length) return alert("Nenhum atendimento no período");

  const rows = filtrados.map(a=>({
    Data: a.fim_atendimento?.split("T")[0] || "",
    Técnico: a.tecnico_nome,
    Protocolo: a.protocolo,
    "Protocolo SPE": a.protocolo_spe || "",
    Início: a.inicio_deslocamento?.split("T")[1]?.slice(0,5) || "",
    Fim: a.fim_atendimento?.split("T")[1]?.slice(0,5) || "",
    Plantão: formatarPlantao(minutosPlantao(a.inicio_deslocamento, a.fim_atendimento))
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Plantao");
  XLSX.writeFile(wb, "relatorio_plantao.xlsx");

  alert("Planilha gerada com sucesso!");
}
</script>

</body>
</html>
