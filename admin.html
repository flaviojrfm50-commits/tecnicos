<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Administração</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  max-width: 1000px;
  margin: 20px auto;
  background: #f4f4f4;
  padding: 20px;
  border-radius: 8px;
}
h2, h3 { text-align:center; }

label { font-weight: bold; margin-top: 10px; display:block; }
input, button, select, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

button {
  border: none;
  cursor: pointer;
  margin-top: 8px;
}

.btn-add { background:#007bff; color:#fff; }
.btn-edit { background:#ffc107; }
.btn-danger { background:#dc3545; color:#fff; }
.btn-success { background:#28a745; color:#fff; }
.btn-export { background:#28a745; color:#fff; margin-top:20px; }

table {
  width: 100%;
  margin-top: 15px;
  border-collapse: collapse;
  background:#fff;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px;
}
th { background:#eee; }
</style>
</head>

<body>

<h2>Administração</h2>

<!-- ================= TECNICOS ================= -->
<h3>Cadastro de Técnicos</h3>

<input type="hidden" id="editIdTec">

<label>Nome</label>
<input id="nomeTec">

<label>Email</label>
<input id="emailTec">

<label>Senha (opcional)</label>
<input id="senhaTec" type="password">

<button class="btn-add" onclick="salvarTecnico()">💾 Salvar Técnico</button>

<table>
<thead>
<tr>
  <th>Nome</th>
  <th>Email</th>
  <th>Status</th>
  <th>Ações</th>
</tr>
</thead>
<tbody id="listaTecnicos"></tbody>
</table>

<!-- ================= AUXILIARES ================= -->
<h3>Cadastro de Auxiliares</h3>

<input type="hidden" id="editIdAux">

<label>Nome</label>
<input id="nomeAux">

<label>Local / Base</label>
<input id="localAux">

<button class="btn-add" onclick="salvarAuxiliar()">💾 Salvar Auxiliar</button>

<table>
<thead>
<tr>
  <th>Nome</th>
  <th>Local</th>
  <th>Status</th>
  <th>Ações</th>
</tr>
</thead>
<tbody id="listaAuxiliares"></tbody>
</table>

<!-- ================= ATENDIMENTOS ================= -->
<h3>Criar Atendimento</h3>

<label>Técnico</label>
<select id="tecnicoAtendimento"></select>

<label>Tipo de Serviço</label>
<input id="tipoServico">

<label>Motivo / Observação</label>
<textarea id="motivoAtendimento"></textarea>

<label>Localização (link Google Maps)</label>
<input id="localizacaoAtendimento" placeholder="https://www.google.com/maps/place/...">

<button class="btn-add" onclick="criarAtendimento()">💾 Criar Atendimento</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

/* ================= UTIL ================= */
function formatarPlantao(min) {
  if (min === null || min === undefined) return "00h00min";
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}min`;
}

/* ================= TECNICOS ================= */
async function listarTecnicos() {
  const { data: tecnicos } = await supabaseClient
    .from("tecnicos")
    .select("*")
    .order("nome");

  listaTecnicos.innerHTML = "";
  tecnicoAtendimento.innerHTML = "<option value=''>Selecione</option>";

  (tecnicos || []).forEach(t => {
    listaTecnicos.innerHTML += `
      <tr>
        <td>${t.nome}</td>
        <td>${t.email}</td>
        <td>${t.ativo ? "<span style='color:#28a745;font-weight:bold'>🟢 Ativo</span>" : "<span style='color:#999'>Inativo</span>"}</td>
        <td>
          <button class="btn-edit" onclick="editarTecnico('${t.id}','${t.nome}','${t.email}')">Editar</button>
          <button class="${t.ativo?"btn-danger":"btn-success"}" onclick="toggleTecnico('${t.id}',${t.ativo})">
            ${t.ativo?"Desativar":"Ativar"}
          </button>
        </td>
      </tr>`;

    if (t.ativo) {
      tecnicoAtendimento.innerHTML += `<option value="${t.nome}">${t.nome}</option>`;
    }
  });
}

async function salvarTecnico() {
  const dados = { nome: nomeTec.value, email: emailTec.value };
  if (senhaTec.value) dados.senha = senhaTec.value;

  if (editIdTec.value) {
    await supabaseClient.from("tecnicos").update(dados).eq("id", editIdTec.value);
  } else {
    dados.ativo = true;
    await supabaseClient.from("tecnicos").insert(dados);
  }
  limparTec();
  listarTecnicos();
}

function editarTecnico(id,n,e){
  editIdTec.value=id;
  nomeTec.value=n;
  emailTec.value=e;
  senhaTec.value="";
}

async function toggleTecnico(id,ativo){
  await supabaseClient.from("tecnicos").update({ativo:!ativo}).eq("id",id);
  listarTecnicos();
}
function limparTec(){ editIdTec.value=""; nomeTec.value=""; emailTec.value=""; senhaTec.value=""; }

/* ================= AUXILIARES ================= */
async function listarAuxiliares() {
  const { data } = await supabaseClient.from("auxiliares").select("*").order("nome");
  listaAuxiliares.innerHTML="";
  (data||[]).forEach(a=>{
    listaAuxiliares.innerHTML+=`
      <tr>
        <td>${a.nome}</td>
        <td>${a.local||""}</td>
        <td>${a.ativo?"Ativo":"Inativo"}</td>
        <td>
          <button class="btn-edit" onclick="editarAux('${a.id}','${a.nome}','${a.local||""}')">Editar</button>
          <button class="${a.ativo?"btn-danger":"btn-success"}" onclick="toggleAux('${a.id}',${a.ativo})">
            ${a.ativo?"Desativar":"Ativar"}
          </button>
        </td>
      </tr>`;
  });
}
async function salvarAuxiliar() {
  const dados = { nome:nomeAux.value, local:localAux.value };
  if (editIdAux.value) {
    await supabaseClient.from("auxiliares").update(dados).eq("id",editIdAux.value);
  } else {
    dados.ativo=true;
    await supabaseClient.from("auxiliares").insert(dados);
  }
  limparAux();
  listarAuxiliares();
}
function editarAux(id,n,l){ editIdAux.value=id; nomeAux.value=n; localAux.value=l; }
async function toggleAux(id,ativo){
  await supabaseClient.from("auxiliares").update({ativo:!ativo}).eq("id",id);
  listarAuxiliares();
}
function limparAux(){ editIdAux.value=""; nomeAux.value=""; localAux.value=""; }

/* ================= ATENDIMENTOS ================= */
async function criarAtendimento() {
  const tecnico = document.getElementById("tecnicoAtendimento").value;
  const tipo = document.getElementById("tipoServico").value.trim();
  const motivo = document.getElementById("motivoAtendimento").value.trim();
  const localizacao = document.getElementById("localizacaoAtendimento").value.trim();

  if (!tecnico || !tipo || !motivo || !localizacao) {
    return alert("Preencha todos os campos!");
  }

  const protocolo = `Prot. ${Math.floor(100000 + Math.random()*900000)}`; // Prot. aleatório

  const dados = {
    tecnico_nome: tecnico,
    tipo_servico: tipo,
    motivo: motivo,
    localizacao: localizacao,
    protocolo: protocolo,
    status: "aberto",
    minutos_plantao: 0,
    inicio_deslocamento: new Date().toISOString()
  };

  try {
    const { error } = await supabaseClient.from("atendimentos").insert(dados);
    if (error) throw error;
    alert(`Atendimento criado com sucesso! Protocolo: ${protocolo}`);
    document.getElementById("tipoServico").value = "";
    document.getElementById("motivoAtendimento").value = "";
    document.getElementById("localizacaoAtendimento").value = "";
  } catch(err) {
    console.error("Erro ao criar atendimento:", err);
    alert("Erro ao criar atendimento: " + JSON.stringify(err));
  }
}

/* ================= INIT ================= */
listarTecnicos();
listarAuxiliares();
</script>

</body>
</html>
