<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Administração</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; max-width: 1000px; margin: 20px auto; background:#f4f4f4; padding:20px; border-radius:8px;}
h2,h3{text-align:center;}
label{font-weight:bold;margin-top:10px;display:block;}
input,textarea,select,button{width:100%;padding:8px;margin-top:5px;}
button{border:none;cursor:pointer;margin-top:8px;}
.btn-add{background:#007bff;color:#fff;}
.btn-edit{background:#ffc107;}
.btn-danger{background:#dc3545;color:#fff;}
.btn-success{background:#28a745;color:#fff;}
.btn-export{background:#28a745;color:#fff;margin-top:20px;}
table{width:100%;margin-top:15px;border-collapse:collapse;background:#fff;}
th,td{border:1px solid #ccc;padding:6px;}
th{background:#eee;}
</style>
</head>
<body>

<h2>Administração</h2>

<!-- ================= TECNICOS ================= -->
<h3>Cadastro de Técnicos</h3>
<input type="hidden" id="editIdTec">
<label>Nome</label><input id="nomeTec">
<label>Email</label><input id="emailTec">
<label>Senha (opcional)</label><input id="senhaTec" type="password">
<button class="btn-add" onclick="salvarTecnico()">💾 Salvar Técnico</button>

<table>
<thead>
<tr><th>Nome</th><th>Email</th><th>Status</th><th>Ações</th></tr>
</thead>
<tbody id="listaTecnicos"></tbody>
</table>

<!-- ================= AUXILIARES ================= -->
<h3>Cadastro de Auxiliares</h3>
<input type="hidden" id="editIdAux">
<label>Nome</label><input id="nomeAux">
<label>Local / Base</label><input id="localAux">
<button class="btn-add" onclick="salvarAuxiliar()">💾 Salvar Auxiliar</button>

<table>
<thead>
<tr><th>Nome</th><th>Local</th><th>Status</th><th>Ações</th></tr>
</thead>
<tbody id="listaAuxiliares"></tbody>
</table>

<!-- ================= CRIAR ATENDIMENTO ================= -->
<h3>Criar Atendimento</h3>

<label>Protocolo (obrigatório)</label>
<input id="protocoloAtendimento" placeholder="Somente números">

<label>Protocolo SPE (opcional)</label>
<input id="protocoloSPEAtendimento" placeholder="Opcional">

<label>Tipo de Serviço</label>
<input id="tipoServico">

<label>Descrição</label>
<textarea id="descricaoAtendimento"></textarea>
<label>Material necessário (se houver)</label>
<textarea
  id="materiaisAtendimento"
  placeholder="Ex: ONT, fonte 12V, conector SC/APC, cabo drop...">
</textarea>

<label>Local do Serviço</label>
<input id="localServicoAtendimento" placeholder="Ex: SÃO JOÃO - ESCOLA MUNICIPAL">

<label>Localização (Google Maps)</label>
<input id="localizacaoAtendimento" placeholder="https://maps.app.goo.gl/...">

<label>Técnico Responsável</label>
<select id="tecnicoAtendimento"></select>

<button class="btn-add" onclick="criarAtendimento()">💾 Criar Atendimento</button>

<!-- ================= RELATORIO ================= -->
<h3>Relatório de Plantão</h3>
<label>Data início</label><input type="date" id="dataInicio">
<label>Data fim</label><input type="date" id="dataFim">
<button class="btn-export" onclick="exportarExcel()">📊 Exportar Excel</button>
<button class="btn-export" onclick="exportarExcelResumoPorTecnico()">📊 Resumo por Técnico</button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

/* ================= UTIL ================= */
function formatarPlantao(min){
  if(!min) return "00h00min";
  const h = Math.floor(min/60), m = min % 60;
  return `${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}min`;
}

/* ================= TECNICOS ================= */
async function listarTecnicos(){
  const {data} = await supabaseClient.from("tecnicos").select("*").order("nome");
  listaTecnicos.innerHTML = "";
  (data || []).forEach(t=>{
    listaTecnicos.innerHTML += `
    <tr>
      <td>${t.nome}</td>
      <td>${t.email}</td>
      <td>${t.ativo ? "🟢 ATIVO" : "🔴 INATIVO"}</td>
      <td>
        <button class="btn-edit" onclick="editarTecnico('${t.id}','${t.nome}','${t.email}')">Editar</button>
        <button class="${t.ativo ? "btn-danger" : "btn-success"}" onclick="toggleTecnico('${t.id}',${t.ativo})">
          ${t.ativo ? "Desativar" : "Ativar"}
        </button>
      </td>
    </tr>`;
  });
}

async function salvarTecnico(){
  const dados = { nome: nomeTec.value, email: emailTec.value };
  if(senhaTec.value) dados.senha = senhaTec.value;

  if(editIdTec.value){
    await supabaseClient.from("tecnicos").update(dados).eq("id", editIdTec.value);
  } else {
    dados.ativo = true;
    await supabaseClient.from("tecnicos").insert(dados);
  }
  limparTec();
  listarTecnicos();
  carregarTecnicosSelect();
}

function editarTecnico(id,n,e){
  editIdTec.value = id;
  nomeTec.value = n;
  emailTec.value = e;
  senhaTec.value = "";
}

async function toggleTecnico(id,ativo){
  await supabaseClient.from("tecnicos").update({ativo: !ativo}).eq("id", id);
  listarTecnicos();
  carregarTecnicosSelect();
}

function limparTec(){
  editIdTec.value = "";
  nomeTec.value = "";
  emailTec.value = "";
  senhaTec.value = "";
}

/* ================= AUXILIARES ================= */
async function listarAuxiliares(){
  const {data} = await supabaseClient.from("auxiliares").select("*").order("nome");
  listaAuxiliares.innerHTML = "";
  (data || []).forEach(a=>{
    listaAuxiliares.innerHTML += `
    <tr>
      <td>${a.nome}</td>
      <td>${a.local || ""}</td>
      <td>${a.ativo ? "🟢 ATIVO" : "🔴 INATIVO"}</td>
      <td>
        <button class="btn-edit" onclick="editarAux('${a.id}','${a.nome}','${a.local || ""}')">Editar</button>
        <button class="${a.ativo ? "btn-danger" : "btn-success"}" onclick="toggleAux('${a.id}',${a.ativo})">
          ${a.ativo ? "Desativar" : "Ativar"}
        </button>
      </td>
    </tr>`;
  });
}

async function salvarAuxiliar(){
  const dados = { nome: nomeAux.value, local: localAux.value };
  if(editIdAux.value){
    await supabaseClient.from("auxiliares").update(dados).eq("id", editIdAux.value);
  } else {
    dados.ativo = true;
    await supabaseClient.from("auxiliares").insert(dados);
  }
  limparAux();
  listarAuxiliares();
}

function editarAux(id,n,l){
  editIdAux.value = id;
  nomeAux.value = n;
  localAux.value = l;
}

async function toggleAux(id,ativo){
  await supabaseClient.from("auxiliares").update({ativo: !ativo}).eq("id", id);
  listarAuxiliares();
}

function limparAux(){
  editIdAux.value = "";
  nomeAux.value = "";
  localAux.value = "";
}

/* ================= TECNICOS SELECT ================= */
async function carregarTecnicosSelect(){
  const {data} = await supabaseClient
    .from("tecnicos")
    .select("nome")
    .eq("ativo", true)
    .order("nome");

  tecnicoAtendimento.innerHTML = "<option value=''>Selecione o técnico</option>";
  (data || []).forEach(t=>{
    const o = document.createElement("option");
    o.value = t.nome;
    o.textContent = t.nome;
    tecnicoAtendimento.appendChild(o);
  });
}

/* ================= CRIAR ATENDIMENTO ================= */
async function criarAtendimento(){
  if(!protocoloAtendimento.value || !tecnicoAtendimento.value)
    return alert("Informe o protocolo e o técnico");

  const dados = {
  protocolo: Number(protocoloAtendimento.value),
  protocolo_spe: protocoloSPEAtendimento.value || null,

  tipo_servico: tipoServico.value || null,
  descricao: descricaoAtendimento.value || null,
  materiais: materiaisAtendimento.value || null,
  local_servico: localServicoAtendimento.value || null,
  localizacao: localizacaoAtendimento.value || null,

  tecnico_nome: tecnicoAtendimento.value,
  status: "aberto",          // ✅ ESSENCIAL
  minutos_plantao: 0
};


  const { error } = await supabaseClient
    .from("atendimentos")
    .insert([dados]);

  if(error) return alert("Erro ao criar atendimento: " + error.message);

  alert("Atendimento criado com sucesso!");

  protocoloAtendimento.value = "";
  protocoloSPEAtendimento.value = "";
  tipoServico.value = "";
  descricaoAtendimento.value = "";
  materiaisAtendimento.value = ""; // 👈 LIMPA MATERIAL
  localServicoAtendimento.value = "";
  localizacaoAtendimento.value = "";
  tecnicoAtendimento.value = "";
}

/* ================= EXPORTAR EXCEL ================= */
async function exportarExcel() {
  if (!dataInicio.value || !dataFim.value) {
    return alert("Informe o período");
  }

  // Função para ajustar datas para SP
  function ajustarDataSP(dateStr, fim = false) {
    const d = new Date(dateStr + "T00:00:00");
    const offset = -3; // SP é UTC-3
    d.setHours(d.getHours() + offset);
    if (fim) d.setHours(d.getHours() + 24); // fim do dia
    return d;
  }

  const inicioSP = ajustarDataSP(dataInicio.value);
  const fimSP = ajustarDataSP(dataFim.value, true);

 
  // Determinar data do plantão considerando 18h
  function calcularDataPlantao(inicioISO, fimISO) {
    const d = new Date(fimISO || inicioISO);
    const horaSP = new Date(
      d.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" })
    ).getHours();

    // Plantão após 18h permanece no dia, senão não entra
    return d.toISOString().split("T")[0];
  }

  try {
    const { data, error } = await supabaseClient
      .from("atendimentos")
      .select("*")
      .eq("status", "finalizado")
      .gt("minutos_plantao", 0);

    if (error) {
      console.error("Erro Supabase:", error);
      return alert("Erro ao buscar dados. Veja o console.");
    }

    // Filtrar plantões no período e após 18h
    const filtrados = (data || []).filter(a => {
      if (!a.fim_atendimento) return false;

      const dFim = new Date(a.fim_atendimento);
      const horaSP = new Date(
        dFim.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" })
      ).getHours();

      const dataPlantao = calcularDataPlantao(a.inicio_deslocamento, a.fim_atendimento);

      // Só plantões dentro do período
      const plantaoDate = new Date(dataPlantao + "T00:00:00");
      return horaSP >= 18 && plantaoDate >= inicioSP && plantaoDate <= fimSP;
    });

    if (filtrados.length === 0) {
      return alert("Nenhum plantão encontrado no período.");
    }

    // Montar linhas para Excel
    const rows = filtrados.map(a => ({
      Data: calcularDataPlantao(a.inicio_deslocamento, a.fim_atendimento),
      Técnico: a.tecnico_nome,
      Protocolo: a.protocolo,
      "Protocolo SPE": a.protocolo_spe || "",
      Início: a.inicio_deslocamento?.split("T")[1]?.slice(0, 5) || "",
      Fim: a.fim_atendimento?.split("T")[1]?.slice(0, 5) || "",
      Plantão: formatarPlantao(calcularMinutosPlantao(a.inicio_deslocamento, a.fim_atendimento))

    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Plantão");
    XLSX.writeFile(wb, "relatorio_plantao.xlsx");

    alert("Planilha gerada com sucesso!");

  } catch (err) {
    console.error("Erro inesperado:", err);
    alert("Ocorreu um erro ao gerar o Excel. Veja o console.");
  }
}



/* ================= INIT ================= */
async function exportarExcelResumoPorTecnico() {
  if (!dataInicio.value || !dataFim.value) {
    return alert("Informe o período");
  }

  const inicioSP = new Date(dataInicio.value + "T00:00:00");
  const fimSP = new Date(dataFim.value + "T23:59:59");


  function calcularDataPlantaoPlantao(inicioISO, fimISO) {
    const d = new Date(fimISO || inicioISO);
    const horaSP = new Date(
      d.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" })
    ).getHours();

    // Plantão das 18h em diante pertence ao dia seguinte
    if (horaSP >= 18) d.setDate(d.getDate() + 1);

    return d.toISOString().split("T")[0];
  }

  try {
    const { data, error } = await supabaseClient
      .from("atendimentos")
      .select("*")
      .eq("status", "finalizado")
      .gt("minutos_plantao", 0);

    if (error) {
      console.error(error);
      return alert("Erro ao buscar dados. Veja o console.");
    }

    const filtrados = (data || []).filter(a => {
      if (!a.fim_atendimento) return false;
      const plantaoDate = new Date(calcularDataPlantaoPlantao(a.inicio_deslocamento, a.fim_atendimento) + "T00:00:00");
      return plantaoDate >= inicioSP && plantaoDate <= fimSP;
    });

    if (filtrados.length === 0) return alert("Nenhum plantão encontrado no período.");

    // Agrupar por técnico e somar minutos
    const resumo = {};
    filtrados.forEach(a => {
  if (!resumo[a.tecnico_nome]) resumo[a.tecnico_nome] = 0;
  resumo[a.tecnico_nome] += calcularMinutosPlantao(a.inicio_deslocamento, a.fim_atendimento);
});


    const rows = Object.entries(resumo).map(([tec, min]) => ({
      Técnico: tec,
      "Total Plantão": formatarPlantao(min)
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Resumo Plantão");
    XLSX.writeFile(wb, "resumo_plantao.xlsx");

    alert("Planilha resumida por técnico gerada com sucesso!");
  } catch (err) {
    console.error(err);
    alert("Ocorreu um erro ao gerar o Excel. Veja o console.");
  }
}
function calcularMinutosPlantao(inicioISO, fimISO) {
  if (!inicioISO || !fimISO) return 0;

  const inicio = new Date(inicioISO);
  const fim = new Date(fimISO);

  // Diferença em minutos
  let diffMin = Math.floor((fim - inicio) / 1000 / 60);

  // Se quiser garantir mínimo de 1 minuto
  if (diffMin <= 0) diffMin = 1;

  return diffMin;
}



listarTecnicos();
listarAuxiliares();
carregarTecnicosSelect();

function calcularDataPlantao(inicioISO){
  const d = new Date(inicioISO);

  const horaSP = new Date(
    d.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" })
  ).getHours();

  // Plantão das 18h em diante pertence ao dia seguinte
  if (horaSP >= 18) {
    d.setDate(d.getDate() + 1);
  }

  return d.toISOString().split("T")[0];
}

</script>

</body>
</html>
