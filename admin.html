<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel do Técnico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial; max-width: 820px; margin: 20px auto; background: #f4f4f4; padding: 20px; border-radius: 8px; }
    label { font-weight: bold; margin-top: 12px; display:block; }
    input, textarea, select, button { width: 100%; padding: 10px; margin-top: 5px; }
    button { background: #28a745; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
    button:hover { background: #218838; }
    #statusAtendimento { font-weight: bold; font-size: 16px; margin: 8px 0; }
  </style>
</head>
<body>

<h2>Painel do Técnico</h2>

<!-- LOGIN -->
<div id="loginForm">
  <label>Email</label>
  <input id="loginEmail" type="email" />
  <label>Senha</label>
  <input id="loginSenha" type="password" />
  <button onclick="login()">Entrar</button>
</div>

<!-- ATENDIMENTO -->
<div id="atendimentoForm" style="display:none;">
  <p>
    Técnico: <strong id="tecnicoLogado"></strong><br />
    <span id="statusAtendimento">🟢 SEM ATENDIMENTO</span>
  </p>

  <label>Atendimentos Disponíveis</label>
  <select id="selectAtendimento" onchange="onAtendimentoChange()"></select>

  <!-- INICIAR -->
  <div id="iniciarBox" style="display:none;">
    <label>Carro</label>
    <select id="carroSelect"></select>

    <label>KM Inicial</label>
    <input id="kmInicial" type="number" min="0" />

    <button onclick="iniciarAtendimento()">▶️ Iniciar Atendimento</button>
  </div>

  <!-- FINALIZAR -->
  <div id="finalizarBox" style="display:none;">
    <label>KM Final</label>
    <input id="kmFinal" type="number" min="0" />

    <label>Como resolveu</label>
    <textarea id="comoResolveu"></textarea>

    <button onclick="finalizarAtendimento()">✅ Finalizar Atendimento</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ===== SUPABASE =====
  const { createClient } = supabase;
  const supabaseClient = createClient(
    "https://bzgvbghxmebdjqnlakbj.supabase.co",
    "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
  );

  // ===== TELEGRAM =====
  const TELEGRAM_TOKEN = "8401740337:AAFxWCHx8M8Mc8Z-WHhhT-nfGlhAGP9L4dA";
  const TELEGRAM_CHAT_ID = "-4860857271";

  // Variáveis globais
  let tecnicoNome = "";
  let atendimentoAtual = null;

  // ===== HELPERS =====
  function agoraBR() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
  }
  function dataBR(iso) { 
    return iso ? iso.split("T")[0].split("-").reverse().join("/") : ""; 
  }
  function horaBR(iso) { 
    return iso ? iso.split("T")[1].slice(0,5) : ""; 
  }
  function formatarPlantao(min){
    const h = Math.floor(min / 60), m = min % 60;
    return `${String(h).padStart(2,"0")}h${String(m).padStart(2,"0")}min`;
  }
  function calcularMinutosPlantao(inicio, fim){
    let a = new Date(inicio), f = new Date(fim), m = 0;
    while(a < f){
      const h = a.getHours();
      if(h >= 18 || h < 8) m++;
      a.setMinutes(a.getMinutes() + 1);
    }
    return m;
  }

  // ===== LOGIN =====
  async function login(){
    const email = document.getElementById("loginEmail").value.trim();
    const senha = document.getElementById("loginSenha").value.trim();
    if (!email || !senha) {
      alert("Informe e-mail e senha");
      return;
    }

    const { data, error } = await supabaseClient
      .from("tecnicos")
      .select("nome")
      .eq("email", email)
      .eq("senha", senha)
      .eq("ativo", true)
      .single();

    if(error || !data){
      alert("Login inválido");
      return;
    }

    tecnicoNome = data.nome;
    document.getElementById("tecnicoLogado").textContent = tecnicoNome;
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("atendimentoForm").style.display = "block";

    carregarAtendimentos();
    carregarCarros();
  }

  // ===== ATENDIMENTOS =====
  async function carregarAtendimentos(){
    const { data, error } = await supabaseClient
      .from("atendimentos")
      .select("*")
      .eq("tecnico_nome", tecnicoNome)
      .eq("status", "aberto");

    const selectAtendimento = document.getElementById("selectAtendimento");
    selectAtendimento.innerHTML = "";

    if(error || !data || data.length === 0){
      selectAtendimento.innerHTML = "<option>Nenhum atendimento</option>";
      document.getElementById("statusAtendimento").textContent = "🟢 SEM ATENDIMENTO";
      document.getElementById("iniciarBox").style.display = "none";
      document.getElementById("finalizarBox").style.display = "none";
      atendimentoAtual = null;
      return;
    }

    data.forEach(a => {
      const o = document.createElement("option");
      o.value = a.id;
      o.textContent = `Prot: ${a.protocolo}`;
      selectAtendimento.appendChild(o);
    });

    onAtendimentoChange();
  }

  async function onAtendimentoChange(){
    const selectAtendimento = document.getElementById("selectAtendimento");
    const id = selectAtendimento.value;
    if(!id) return;

    const { data, error } = await supabaseClient
      .from("atendimentos")
      .select("*")
      .eq("id", id)
      .single();

    if(error || !data) return alert("Erro ao carregar atendimento");

    atendimentoAtual = data;

    if(!data.km_inicial){
      document.getElementById("iniciarBox").style.display = "block";
      document.getElementById("finalizarBox").style.display = "none";
      document.getElementById("statusAtendimento").textContent = "🟡 PENDENTE DE INÍCIO";
    } else {
      document.getElementById("iniciarBox").style.display = "none";
      document.getElementById("finalizarBox").style.display = "block";
      document.getElementById("statusAtendimento").textContent = "🔴 EM ATENDIMENTO";
    }
  }

  // ===== CARROS =====
  async function carregarCarros(){
    const { data, error } = await supabaseClient.from("veiculos").select("*");

    const carroSelect = document.getElementById("carroSelect");
    carroSelect.innerHTML = "<option value=''>Selecione</option>";

    if(error || !data) return;

    data.forEach(v => {
      const o = document.createElement("option");
      o.value = v.placa;
      o.textContent = `${v.placa} - ${v.modelo}`;
      carroSelect.appendChild(o);
    });
  }

  // ===== INICIAR ATENDIMENTO =====
  async function iniciarAtendimento(){
    if(!atendimentoAtual) return alert("Selecione um atendimento");

    const kmIni = Number(document.getElementById("kmInicial").value);
    const carro = document.getElementById("carroSelect").value;

    if(!carro) return alert("Selecione o carro");
    if(!kmIni) return alert("Informe o KM inicial");

    const { data, error } = await supabaseClient
      .from("atendimentos")
      .update({
        km_inicial: kmIni,
        veiculo_nome: carro,
        inicio_deslocamento: agoraBR(),
        status: "em andamento"
      })
      .eq("id", atendimentoAtual.id)
      .select()
      .single();

    if(error){
      console.error(error);
      return alert("Erro ao iniciar atendimento");
    }

    atendimentoAtual = data;
    document.getElementById("iniciarBox").style.display = "none";
    document.getElementById("finalizarBox").style.display = "block";
    document.getElementById("statusAtendimento").textContent = "🔴 EM ATENDIMENTO";

    alert("Atendimento iniciado!");
  }

  // ===== FINALIZAR ATENDIMENTO =====
  async function finalizarAtendimento(){
    const kmF = Number(document.getElementById("kmFinal").value);
    const relato = document.getElementById("comoResolveu").value.trim();

    if(!kmF) return alert("Informe o KM final");
    if(!relato) return alert("Descreva como resolveu");

    const fim = agoraBR();
    const minutos = calcularMinutosPlantao(atendimentoAtual.inicio_deslocamento, fim);
    const kmTotal = kmF - atendimentoAtual.km_inicial;

    const { error } = await supabaseClient.from("atendimentos").update({
      fim_atendimento: fim,
      status: "finalizado",
      km_final: kmF,
      km_total: kmTotal,
      minutos_plantao: minutos,
      como_resolveu: relato
    }).eq("id", atendimentoAtual.id);

    if(error){
      console.error(error);
      return alert("Erro ao finalizar atendimento");
    }

    // Enviar mensagem para Telegram
    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text:
`✅ ATENDIMENTO FINALIZADO

📅 Data: ${dataBR(atendimentoAtual.inicio_deslocamento)}
👨‍🔧 Técnico: ${atendimentoAtual.tecnico_nome}
🚗 Carro: ${atendimentoAtual.veiculo_nome}

📍 KM Inicial: ${atendimentoAtual.km_inicial}
🏁 KM Final: ${kmF}
📏 KM Total: ${kmTotal}

🕒 Início: ${horaBR(atendimentoAtual.inicio_deslocamento)}
🕒 Fim: ${horaBR(fim)}
⏱ Plantão: ${formatarPlantao(minutos)}

📄 Protocolo: ${atendimentoAtual.protocolo}

🧭 O que ocasionou o serviço:
${atendimentoAtual.tipo_servico || atendimentoAtual.motivo || "Não informado"}

📋 Como resolveu:
${relato}

📌 Localização:
${atendimentoAtual.localizacao || "Não informado"}`
      })
    });

    alert("Atendimento finalizado!");
    carregarAtendimentos();

    // Resetar campos
    document.getElementById("kmInicial").value = "";
    document.getElementById("kmFinal").value = "";
    document.getElementById("comoResolveu").value = "";
  }
</script>

</body>
</html>
